; Waveshare ESP32-S3-POE-ETH-8DI-8RO — DMX / Art-Net relay node
; ESP32-S3-WROOM-1U-N16R8: 16 MB QIO flash, 8 MB octal PSRAM.

[platformio]
default_envs = esp32-s3-poe-eth-8di-8ro

[env:esp32-s3-poe-eth-8di-8ro]
; pioarduino ships Arduino-ESP32 3.x (ESP-IDF 5.x), which has native W5500 support in ETH.h.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    bblanchon/ArduinoJson@^7.4.2

; Gzips web/index.html into src/web_index.h before each build.
extra_scripts = pre:scripts/embed_web.py

; USB speaker support is animatronic-only.
lib_ignore = usb_host_uac

; Animatronic variant: relays 1/2 drive a reversing motor with a DI1 limit switch,
; relay 3 the eyes. Same settings storage, so switching builds keeps the config.
[env:animatronic]
extends = env:esp32-s3-poe-eth-8di-8ro
build_flags =
    ${env:esp32-s3-poe-eth-8di-8ro.build_flags}
    -DANIMATRONIC
    ; Kconfig options of the vendored USB Audio Class host driver (lib/usb_host_uac)
    -DCONFIG_UAC_DEV_ADDR_LIST_MAX=6
    -DCONFIG_UAC_FREQ_NUM_MAX=4
    -DCONFIG_UAC_NUM_ISOC_URBS=6
    -DCONFIG_UAC_NUM_PACKETS_PER_URB=1
    -DCONFIG_UAC_RINGBUF_SAFE_DELETE_WAITING_MS=50
lib_ignore =
